<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Call Portal - HealthConnect</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0fdf4; margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .btn-accept { background: #16a34a; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        .btn-reject { background: #dc2626; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; margin-left: 8px; }
    </style>
</head>
<body>

<h2>👨‍⚕️ Doctor Call Management</h2>
<div class="card">
    <label>Doctor ID: </label>
    <input type="number" id="doctorId" value="1">
    <button onclick="loadPendingRequests()">Load Requests</button>
</div>

<div class="card">
    <h3>Incoming Requests</h3>
    <div id="doctorRequests">No pending requests.</div>
</div>

<script>
const API_BASE = "http://localhost:8080/api";

async function loadPendingRequests() {
    const dId = document.getElementById("doctorId").value;
    try {
        const res = await fetch(`${API_BASE}/call-requests/doctor/${dId}/pending`);
        const data = await res.json();
        const container = document.getElementById("doctorRequests");
        container.innerHTML = "";

        if (data.length === 0) {
            container.innerHTML = "<p>No incoming calls.</p>";
            return;
        }

        data.forEach(req => {
            const div = document.createElement("div");
            div.style.padding = "10px";
            div.style.borderBottom = "1px solid #ccc";
            div.innerHTML = `
                <p><strong>Patient ID:</strong> ${req.patientId} | <strong>Type:</strong> ${req.callType}</p>
                <button class="btn-accept" onclick="respondCall(${req.id}, 'accept')">Accept Call</button>
                <button class="btn-reject" onclick="respondCall(${req.id}, 'reject')">Reject</button>
            `;
            container.appendChild(div);
        });
    } catch(err) {
        console.error(err);
    }
}

async function respondCall(requestId, action) {
    const dId = document.getElementById("doctorId").value;
    try {
        const res = await fetch(`${API_BASE}/call-requests/${requestId}/${action}/${dId}`, { method: "PUT" });
        if (!res.ok) throw new Error(await res.text());
        alert(`Call ${action}ed successfully!`);
        loadPendingRequests();
    } catch(err) {
        alert("Action failed: " + err.message);
    }
}

setInterval(loadPendingRequests, 4000);
</script>
</body>
</html>
