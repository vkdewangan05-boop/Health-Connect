<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Call Portal - HealthConnect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #111827; color: white; text-align: center; }
        .header { background: #0f766e; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .video-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 30px auto; max-width: 1000px; }
        video { width: 45%; max-width: 450px; height: 320px; background: #1f2937; border-radius: 12px; border: 2px solid #374151; object-fit: cover; }
        .controls { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .start-btn { background: #16a34a; color: white; }
        .end-btn { background: #dc2626; color: white; }
    </style>
</head>
<body>

<div class="header">
    <h2>🩺 Doctor Call Portal</h2>
    <button onclick="window.close()" class="end-btn">Exit Call</button>
</div>

<h3 id="callStatus" style="margin-top:20px; color:#38bdf8;">Click 'Start Call' to connect stream</h3>

<div class="video-container">
    <div>
        <p style="margin-bottom:8px;">Local Stream (You)</p>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div>
        <p style="margin-bottom:8px;">Patient Stream</p>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
</div>

<div class="controls">
    <button class="start-btn" onclick="startCall()">🎥 Start Call</button>
    <button class="end-btn" onclick="endCall()">🛑 End Call</button>
</div>

<script>
    let localStream;
    const urlParams = new URLSearchParams(window.location.search);
    const consultationId = urlParams.get('consultationId');

    async function startCall() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById("localVideo").srcObject = localStream;
            document.getElementById("callStatus").innerText = `Connected to Consultation #${consultationId || ''}`;
        } catch (error) {
            alert("Camera & Microphone access denied or unavailable.");
        }
    }

    function endCall() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById("callStatus").innerText = "Call ended.";
        alert("Call Session Ended.");
        window.close();
    }
</script>

</body>
</html>
