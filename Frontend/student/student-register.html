<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medical Student Registration - HealthConnect</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/auth.css">

</head>


<body>

<div class="auth-container">


    <div class="login-card">


        <div class="auth-header">

            <h1>
                Medical Student Registration
            </h1>

            <p>
                Create your HealthConnect student account
            </p>

        </div>



        <form id="studentRegisterForm">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    required
                    placeholder="Enter full name">

            </div>



            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="Enter email">

            </div>



            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="text"
                    id="mobile"
                    required
                    maxlength="10"
                    placeholder="10-digit mobile number">

            </div>



            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    required
                    placeholder="Create username">

            </div>



            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    placeholder="Create password">

            </div>



            <div class="form-group">

                <label>
                    College Name
                </label>

                <input
                    type="text"
                    id="collegeName"
                    required
                    placeholder="Medical college name">

            </div>



            <div class="form-group">

                <label>
                    Qualification
                </label>

                <input
                    type="text"
                    id="qualification"
                    required
                    placeholder="Example: MBBS">

            </div>



            <div class="form-group">

                <label>
                    Current Year
                </label>

                <select id="year" required>

                    <option value="">
                        Select Year
                    </option>

                    <option value="1">
                        1st Year
                    </option>

                    <option value="2">
                        2nd Year
                    </option>

                    <option value="3">
                        3rd Year
                    </option>

                    <option value="4">
                        4th Year
                    </option>

                    <option value="5">
                        5th Year
                    </option>

                </select>

            </div>



            <div class="form-group">

                <label>
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    required
                    placeholder="College student ID">

            </div>



            <button
                type="submit"
                class="login-btn">

                Register

            </button>


            <p id="studentRegisterMessage"></p>


        </form>



        <div class="back-home">

            <a href="../login.html">
                ← Back to Login
            </a>

        </div>


    </div>

</div>



<script src="../Js/student-auth.js"></script>

</body>

</html>
