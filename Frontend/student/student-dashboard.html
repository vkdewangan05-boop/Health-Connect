<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medical Student Dashboard - HealthConnect</title>

    <link rel="stylesheet"
          href="../Css/main.css">

    <link rel="stylesheet"
          href="../Css/dashboard.css">

</head>

<body>

<div class="dashboard-container">

    <header class="dashboard-header">

        <div>

            <h1>HealthConnect</h1>

            <p>
                Medical Student Dashboard
            </p>

        </div>

        <button
            class="logout-btn"
            onclick="logoutStudent()">

            Logout

        </button>

    </header>


    <main class="dashboard-content">

        <div class="dashboard-title">

            <h2>
                Welcome, Medical Student
            </h2>

            <p id="studentInfo">
                Loading student information...
            </p>

        </div>


        <div class="dashboard-card">

            <h3>
                Student Profile
            </h3>

            <div id="profile">

                Loading...

            </div>

        </div>


        <div class="dashboard-card"
             style="margin-top:25px;">

            <h3>
                Patient Guidance Requests
            </h3>

            <p>
                View patient problems and provide
                basic health guidance.
            </p>

            <button
                class="dashboard-btn"
                onclick="loadStudentRequests()">

                Refresh Requests

            </button>

            <div
                id="requestContainer"
                style="margin-top:20px;">

                Loading requests...

            </div>

        </div>

    </main>

</div>


<script src="../Js/student.js"></script>

</body>

</html>
