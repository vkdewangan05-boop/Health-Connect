/* =========================================================
   HEALTHCONNECT API
========================================================= */

const API_URL =
    "http://localhost:8080";



/* =========================================================
   AUTHENTICATION HELPER
========================================================= */

function hcGetAuthToken() {

    const tokenKeys = [
        "token",
        "jwt",
        "accessToken"
    ];


    for (const key of tokenKeys) {

        const token =
            localStorage.getItem(key);


        if (
            token &&
            token.trim() !== ""
        ) {

            return token.trim();

        }

    }


    const storedUser =
        localStorage.getItem(
            "loggedInUser"
        );


    if (storedUser) {

        try {

            const user =
                JSON.parse(
                    storedUser
                );


            const token =
                user.token ||
                user.jwt ||
                user.accessToken;


            if (
                token &&
                String(token).trim() !== ""
            ) {

                return String(token).trim();

            }

        }
        catch (error) {

            console.error(
                "Unable to read authentication data:",
                error
            );

        }

    }


    return null;

}



/* =========================================================
   AUTHENTICATED FETCH
========================================================= */

async function hcAuthenticatedFetch(
    url,
    options = {}
) {

    const token =
        hcGetAuthToken();


    const requestOptions = {
        ...options
    };


    requestOptions.headers = {
        ...(options.headers || {})
    };


    if (
        requestOptions.body &&
        !(requestOptions.body instanceof FormData) &&
        !requestOptions.headers["Content-Type"]
    ) {

        requestOptions.headers["Content-Type"] =
            "application/json";

    }


    if (token) {

        requestOptions.headers["Authorization"] =
            "Bearer " + token;

    }


    const response =
        await window.fetch(
            url,
            requestOptions
        );


    return response;

}



/* =========================================================
   LOGGED-IN USER
========================================================= */

const storedUser =
    localStorage.getItem(
        "loggedInUser"
    );


let user = null;


if (!storedUser) {

    alert(
        "Please login first."
    );

    window.location.href =
        "../login.html";

}
else {

    try {

        user =
            JSON.parse(
                storedUser
            );

    }
    catch (error) {

        console.error(
            "Unable to read logged-in user:",
            error
        );

        alert(
            "Please login again."
        );

        window.location.href =
            "../login.html";

    }

}


if (
    !user ||
    !user.id
) {

    throw new Error(
        "Logged-in user information is missing."
    );

}



/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =========================================================
   NORMALIZE API RESPONSE
========================================================= */

function normalizeArray(data) {

    if (Array.isArray(data)) {

        return data;

    }


    if (
        data &&
        Array.isArray(data.content)
    ) {

        return data.content;

    }


    if (
        data &&
        Array.isArray(data.data)
    ) {

        return data.data;

    }


    if (
        data &&
        Array.isArray(data.records)
    ) {

        return data.records;

    }


    if (
        data &&
        Array.isArray(data.consultations)
    ) {

        return data.consultations;

    }


    if (
        data &&
        Array.isArray(data.prescriptions)
    ) {

        return data.prescriptions;

    }


    if (
        data &&
        Array.isArray(data.testBookings)
    ) {

        return data.testBookings;

    }


    return [];

}



/* =========================================================
   SAFE API JSON
========================================================= */

async function getJSON(
    url,
    fallback = []
) {

    try {

        const response =
            await hcAuthenticatedFetch(
                url
            );


        if (!response.ok) {

            console.warn(
                "API returned:",
                response.status,
                url
            );

            return fallback;

        }


        const data =
            await response.json();


        return data;

    }
    catch (error) {

        console.error(
            "API Error:",
            url,
            error
        );

        return fallback;

    }

}



/* =========================================================
   VALUE HELPER
========================================================= */

function firstValue(
    object,
    fields,
    fallback = "N/A"
) {

    if (!object) {

        return fallback;

    }


    for (
        const field of fields
    ) {

        const value =
            object[field];


        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {

            return value;

        }

    }


    return fallback;

}

/* =========================================================
   BUILD CONSULTATION
========================================================= */

async function buildConsultation(
    consultation,
    prescriptions
) {


    const consultationId =
        firstValue(
            consultation,
            [
                "id",
                "consultationId"
            ],
            "N/A"
        );


    const doctorName =
        firstValue(
            consultation,
            [
                "doctorUsername",
                "doctorName",
                "doctorFullName",
                "doctor",
                "doctorId"
            ]
        );


    const doctorId =
        firstValue(
            consultation,
            [
                "doctorId",
                "doctorID"
            ]
        );


    const specialization =
        firstValue(
            consultation,
            [
                "specialization",
                "doctorSpecialization",
                "doctorSpeciality",
                "doctorSpecialty"
            ]
        );


    const reason =
        firstValue(
            consultation,
            [
                "reason",
                "consultationReason",
                "problem",
                "description"
            ]
        );


    const status =
        firstValue(
            consultation,
            [
                "status"
            ]
        );


    const createdAt =
        firstValue(
            consultation,
            [
                "createdAt",
                "createdDate",
                "requestDate"
            ]
        );


    const acceptedAt =
        firstValue(
            consultation,
            [
                "acceptedAt",
                "confirmedAt"
            ]
        );


    const completedAt =
        firstValue(
            consultation,
            [
                "completedAt",
                "completionDate"
            ]
        );


    let html = `

        <div
            style="
                margin-top:15px;
                padding:15px;
                border:1px solid #e5e7eb;
                border-radius:10px;
            "
        >

            <h4>
                Consultation #${escapeHTML(
                    consultationId
                )}
            </h4>


            <p>
                <strong>
                    Doctor:
                </strong>

                ${escapeHTML(
                    doctorName
                )}

            </p>


            <p>
                <strong>
                    Doctor ID:
                </strong>

                ${escapeHTML(
                    doctorId
                )}

            </p>


            <p>
                <strong>
                    Specialization:
                </strong>

                ${escapeHTML(
                    specialization
                )}

            </p>


            <p>
                <strong>
                    Reason:
                </strong>

                ${escapeHTML(
                    reason
                )}

            </p>


            <p>
                <strong>
                    Status:
                </strong>

                ${escapeHTML(
                    status
                )}

            </p>


            <p>
                <strong>
                    Created At:
                </strong>

                ${escapeHTML(
                    createdAt
                )}

            </p>


            <p>
                <strong>
                    Accepted At:
                </strong>

                ${escapeHTML(
                    acceptedAt
                )}

            </p>


            <p>
                <strong>
                    Completed At:
                </strong>

                ${escapeHTML(
                    completedAt
                )}

            </p>


            <h4 style="margin-top:20px;">
                Consultation Prescriptions
            </h4>

    `;



    /* =====================================================
       FIND PRESCRIPTIONS FOR THIS CONSULTATION
    ===================================================== */

    const consultationPrescriptions =
        Array.isArray(
            prescriptions
        )
            ? prescriptions.filter(
                prescription => {

                    const prescriptionConsultationId =
                        firstValue(
                            prescription,
                            [
                                "consultationId",
                                "consultationID",
                                "consultation_id"
                            ],
                            null
                        );


                    return (
                        prescriptionConsultationId !== null &&
                        Number(
                            prescriptionConsultationId
                        ) ===
                        Number(
                            consultationId
                        )
                    );

                }
            )
            : [];



    if (
        consultationPrescriptions.length === 0
    ) {

        html += `

            <p>
                No prescription issued for this consultation.
            </p>

        `;

    }
    else {

        for (
            const prescription
            of consultationPrescriptions
        ) {

            html +=
                await buildPrescription(
                    prescription
                );

        }

    }



    html += `

        </div>

    `;


    return html;

}

                )}

            </p>


            <p>
                <strong>
                    Status:
                </strong>

                ${escapeHTML(
                    status
                )}

            </p>


            <div>

                <strong>
                    Medicines:
                </strong>

    `;



    /* =====================================================
       LOAD MEDICINES
    ===================================================== */

    const medicinesResponse =
        await getJSON(
            API_URL +
            "/api/prescription-medicines/prescription/" +
            prescriptionId,
            []
        );


    const medicines =
        normalizeArray(
            medicinesResponse
        );



    if (
        medicines.length === 0
    ) {

        html += `

            <p>
                No medicines were prescribed.
            </p>

        `;

    }
    else {

        medicines.forEach(
            medicine => {


                const medicineName =
                    firstValue(
                        medicine,
                        [
                            "medicineName",
                            "name",
                            "medicine"
                        ]
                    );


                const medicineId =
                    firstValue(
                        medicine,
                        [
                            "medicineId",
                            "medicineID"
                        ]
                    );


                const dosage =
                    firstValue(
                        medicine,
                        [
                            "dosage",
                            "dose"
                        ]
                    );


                const frequency =
                    firstValue(
                        medicine,
                        [
                            "frequency"
                        ]
                    );


                const duration =
                    firstValue(
                        medicine,
                        [
                            "duration"
                        ]
                    );


                const medicineInstructions =
                    firstValue(
                        medicine,
                        [
                            "instructions",
                            "instruction"
                        ]
                    );



                html += `

                    <div
                        style="
                            margin-top:8px;
                            padding:10px;
                            border:1px solid #e5e7eb;
                            border-radius:8px;
                        "
                    >

                        <p>
                            <strong>
                                Medicine:
                            </strong>

                            ${escapeHTML(
                                medicineName
                            )}

                        </p>


                        <p>
                            <strong>
                                Medicine ID:
                            </strong>

                            ${escapeHTML(
                                medicineId
                            )}

                        </p>


                        <p>
                            <strong>
                                Dosage:
                            </strong>

                            ${escapeHTML(
                                dosage
                            )}

                        </p>


                        <p>
                            <strong>
                                Frequency:
                            </strong>

                            ${escapeHTML(
                                frequency
                            )}

                        </p>


                        <p>
                            <strong>
                                Duration:
                            </strong>

                            ${escapeHTML(
                                duration
                            )}

                        </p>


                        <p>
                            <strong>
                                Instructions:
                            </strong>

                            ${escapeHTML(
                                medicineInstructions
                            )}

                        </p>

                    </div>

                `;

            }
        );

    }



    html += `

            </div>

        </div>

    `;


    return html;

}
