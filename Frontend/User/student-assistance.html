<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Health Assistance - HealthConnect</title>

    <link rel="stylesheet"
          href="../Css/main.css">

    <link rel="stylesheet"
          href="../Css/dashboard.css">

</head>


<body>

<div class="dashboard-container">


    <!-- HEADER -->

    <header class="dashboard-header">

        <div>

            <h1>
                HealthConnect
            </h1>

            <p>
                Basic Health Assistance
            </p>

        </div>


        <button
            class="logout-btn"
            onclick="logoutUser()">

            Logout

        </button>

    </header>



    <!-- CONTENT -->

    <main class="dashboard-content">


        <div class="dashboard-title">

            <h2>
                Student Health Assistance
            </h2>

            <p>

                Explain your health problem and request
                basic guidance from an available medical student.

            </p>

        </div>



        <!-- REQUEST FORM -->

        <div class="dashboard-card">

            <h3>
                Request Basic Guidance
            </h3>


            <form id="studentAssistanceForm">


                <div style="margin-top:15px;">

                    <label>
                        Describe Your Problem
                    </label>

                    <textarea
                        id="problem"
                        required
                        placeholder="Describe your health problem..."
                        rows="6"
                        style="
                            width:100%;
                            padding:12px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:7px;
                            resize:vertical;
                        ">
                    </textarea>

                </div>



                <div style="margin-top:15px;">

                    <label>
                        Guidance Type
                    </label>

                    <select
                        id="adviceType"
                        style="
                            width:100%;
                            padding:12px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:7px;
                        ">

                        <option value="GENERAL_GUIDANCE">
                            General Health Guidance
                        </option>

                        <option value="FIRST_AID">
                            Basic First Aid Guidance
                        </option>

                        <option value="HEALTH_EDUCATION">
                            Health Education
                        </option>

                    </select>

                </div>



                <button
                    type="submit"
                    class="dashboard-btn"
                    style="margin-top:20px;">

                    Submit Request

                </button>


            </form>


            <p id="message"
               style="margin-top:15px;">
            </p>

        </div>



        <!-- PREVIOUS REQUESTS -->

        <div
            class="dashboard-card"
            style="margin-top:25px;">

            <h3>
                My Student Assistance Requests
            </h3>


            <button
                class="dashboard-btn"
                onclick="loadMyAssistance()">

                Refresh Requests

            </button>


            <div
                id="requestContainer"
                style="margin-top:20px;">

                Loading requests...

            </div>

        </div>


    </main>

</div>



<script src="../Js/user.js"></script>

<script src="../Js/student-assistance.js"></script>


</body>

</html>
